<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>·</title>
<style>
:root{--bg:#0f1117;--panel:#161a24;--line:#232838;--acc:#6c5ce7;--acc2:#8b7cf6;--txt:#e6e8ef;--mut:#7c8499}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 20% -10%,#1c2140,var(--bg) 60%);color:var(--txt);font:14px/1.4 Inter,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center}
.app{width:min(420px,100vw);height:min(680px,100vh);background:var(--panel);border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px #0008;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}}
header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:#ff5c5c;transition:background .3s}
.dot.on{background:#3ddc84;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.8)}}
header b{font-weight:600}
header span{margin-left:auto;color:var(--mut);font-size:12px}
main{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:#2a3040 transparent}
.m{max-width:78%;padding:9px 14px;border-radius:16px 16px 16px 4px;background:#1b2030;align-self:flex-start;animation:in .32s cubic-bezier(.34,1.56,.64,1);word-break:break-word}
.m small{display:block;color:#9aa3b8;font-size:11px;margin-bottom:2px}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:16px 16px 4px 16px;--dx:24px}
@keyframes in{from{opacity:0;transform:translate(var(--dx,-24px),10px)}}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:10px 16px;color:var(--txt);outline:0;transition:border-color .2s}
input:focus{border-color:var(--acc)}
button{width:40px;height:40px;border:0;border-radius:50%;background:var(--acc);color:#fff;font-size:16px;cursor:pointer;transition:transform .15s,background .2s}
button:hover{background:var(--acc2);transform:scale(1.08)}
button:active{transform:scale(.92)}
</style></head><body>
<div class="app">
 <header><i class="dot" id="dot"></i><b>Chat</b><span id="st"></span></header>
 <main id="log"></main>
 <form id="f"><input id="in" placeholder="Сообщение" autocomplete="off" maxlength="500"><button>➤</button></form>
</div>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
const T="vani/room-7f3a",ME="web-"+Math.random().toString(36).slice(2,6);
const log=document.getElementById("log"),st=document.getElementById("st"),dot=document.getElementById("dot"),inp=document.getElementById("in");
const c=mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
c.on("connect",()=>{dot.classList.add("on");c.subscribe(T)});
c.on("close",()=>dot.classList.remove("on"));
let tt;
c.on("message",(_,p)=>{const d=JSON.parse(p);if(d.from===ME)return;
 if(d.type==="typing"){st.textContent=d.from+" печатает…";clearTimeout(tt);tt=setTimeout(()=>st.textContent="",2000);return}
 if(d.type==="msg")add(d,false)});
function add(d,me){const e=document.createElement("div");e.className="m"+(me?" me":"");
 if(!me){const s=document.createElement("small");s.textContent=d.from;e.append(s)}
 e.append(d.text);log.append(e);log.scrollTo({top:log.scrollHeight,behavior:"smooth"})}
function pub(o){c.publish(T,JSON.stringify({from:ME,ts:Date.now(),...o}))}
let lt=0;inp.oninput=()=>{if(Date.now()-lt>1500){lt=Date.now();pub({type:"typing"})}};
f.onsubmit=e=>{e.preventDefault();const t=inp.value.trim();if(!t)return;pub({type:"msg",text:t});add({text:t},true);inp.value=""};
</script></body></html>
